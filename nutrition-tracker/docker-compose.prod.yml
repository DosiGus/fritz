services:
  migrate:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  app:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-2}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !reset []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !reset []

  worker:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !override
      - voice_tmp:/tmp/voice
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import redis; from app.config import settings; redis.from_url(settings.redis_url).ping()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db-backup:
    build: .
    env_file: .env
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: nutrition
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    command: bash scripts/backup_db.sh

  ollama:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
